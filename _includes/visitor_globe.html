{% assign clustrmaps_id = site.visitor_globe.clustrmaps_id | default: site.visitor_globe_id %}
<div class="sidebar-card sidebar-visitors">
    <h2>Visitors</h2>
    <div class="visitor-globe" aria-label="Historical visitor globe">
        {% if clustrmaps_id %}
        <script type="text/javascript" id="clstr_globe" src="https://clustrmaps.com/globe.js?d={{ clustrmaps_id }}"></script>
        <script>
            document.addEventListener('click', function (event) {
                if (event.target.closest('.sidebar-visitors a')) {
                    event.preventDefault();
                }
            }, true);
        </script>
        {% else %}
        <div class="visitor-globe-placeholder" role="status">
            <div class="visitor-globe-placeholder__icon" aria-hidden="true">
                <i class="fa-solid fa-earth-americas"></i>
            </div>
            <p>Ready</p>
        </div>
        {% endif %}
    </div>
</div>
